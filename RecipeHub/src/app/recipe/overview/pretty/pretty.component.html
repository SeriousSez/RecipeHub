@if (recipes.length > 0) {
<div class="card-group">
  @for (recipe of recipes; track recipe) {
  <article (click)="openRecipe(recipe)" class="recipe-card cursor-pointer" [class.is-selected]="selectedRecipes.includes(recipe)">
    <button class="recipe-select" type="button" (click)="$event.stopPropagation(); selectRecipe.emit(recipe)" [attr.aria-pressed]="selectedRecipes.includes(recipe)">
      <i [ngClass]="selectedRecipes.includes(recipe) ? 'fas fa-check-square' : 'far fa-square'"></i>
    </button>

    <div class="recipe-hero">
      <img [src]="recipe.image?.url || '../assets/images/food.png'" [alt]="recipe.title">
      <div class="recipe-badge" *ngIf="pantryIngredients.length > 0 && getIngredientMatchSummary(recipe).isBestMatch">Best match</div>
    </div>

    <div class="recipe-body">
      <h3 class="recipe-title">{{ recipe.title }}</h3>
      <p class="recipe-subtitle" *ngIf="recipe.description">{{ recipe.description }}</p>

      <div class="recipe-badges" *ngIf="getVisibleBadges(recipe).length > 0">
        <span *ngFor="let badge of getVisibleBadges(recipe)" [ngClass]="badge.kind === 'category' ? 'recipe-category' : 'recipe-tag'">
          {{ badge.value }}
        </span>
      </div>
    </div>
  </article>
  }
</div>
}
