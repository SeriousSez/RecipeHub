<main class="dashboard-shell">
  <header class="dashboard-header">
    <div>
      <p class="dashboard-kicker">{{ 'dashboard.kicker' | translate }}</p>
      <h1>{{ 'dashboard.title' | translate }}</h1>
      <p class="dashboard-subtitle">{{ 'dashboard.subtitle' | translate }}</p>
    </div>
    <i class="fas fa-sliders-h dashboard-header-icon" aria-hidden="true"></i>
  </header>

  <nav class="dashboard-nav" role="navigation" [attr.aria-label]="'dashboard.navigationLabel' | translate">
    <a class="dashboard-nav-link" routerLink="users" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="fa fa-list" aria-hidden="true"></i>
      <span>{{ 'dashboard.usersNav' | translate }}</span>
    </a>
    <a class="dashboard-nav-link" routerLink="ingredients" routerLinkActive="active">
      <i class="fas fa-mortar-pestle" aria-hidden="true"></i>
      <span>{{ 'dashboard.ingredientsNav' | translate }}</span>
    </a>
  </nav>

  <section class="dashboard-content">
    <router-outlet></router-outlet>
  </section>
</main>
