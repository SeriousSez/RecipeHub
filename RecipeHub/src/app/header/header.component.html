<app-mobile-header></app-mobile-header>

<header class="topbar">
  <div class="container-fluid topbar-inner">
    <a class="brand-mark" routerLink="/">
      <span class="brand-icon"><app-recipe-hub></app-recipe-hub></span>
      <span class="brand-text">RecipeHub</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a routerLink="/recipes" routerLinkActive="active">Recipes</a>
      @if (isAuthenticated && isAdmin) {
      <a routerLink="dashboard/users" routerLinkActive="active">Dashboard</a>
      }
      <a routerLink="/grocery" routerLinkActive="active">Grocery</a>
    </nav>

    <div class="topbar-actions">
      @if (!isAuthenticated) {
      <div class="auth-actions">
        <button type="button" class="btn btn-link btn-login" routerLink="/login">Login</button>
        <button type="button" class="btn btn-primary btn-signup" routerLink="/register">Sign up</button>
      </div>
      }

      @if (isAuthenticated) {
      <div class="user-menu dropdown">
        <button class="user-pill dropdown-toggle" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false" type="button">
          <span class="user-name">{{ username }}</span>
          <span class="user-email">{{ email }}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end text-small" aria-labelledby="profileDropdown">
          <li><a class="dropdown-item" routerLink="account/profile">Profile</a></li>
          <li><a class="dropdown-item" routerLink="account/recipes">My Recipes</a></li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li><button type="button" class="dropdown-item" (click)="logout()">Sign out</button></li>
        </ul>
      </div>
      }
    </div>
  </div>
</header>

<label for="nav-toggle" class="nav-toggle-label">
  <span></span>
</label>
