name: Deploy to Simply.com (MSDeploy)

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  PROJECT_PATH: "RecipeHub.Api/RecipeHub.Api.csproj"
  PUBLISH_PATH: "./publish"
  RUNTIME_IDENTIFIER: "win-x86"
  NODE_VERSION: "20.x"
  ANGULAR_WORKING_DIR: "./RecipeHub"
  ANGULAR_DIST_PATH: "./RecipeHub/dist/RecipeHub/browser"
  API_HEALTH_URL: "https://recipes.api.sezginsahin.dk/api/health/ping"
  WEB_HEALTH_URL: "https://recipes.sezginsahin.dk/"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            api:
              - 'RecipeHub.Api/**'
              - 'RecipeHub.ApplicationService/**'
              - 'RecipeHub.Domain/**'
              - 'RecipeHub.Infrastructure/**'
              - '.github/workflows/deploy-to-simply.yml'
            web:
              - 'RecipeHub/**'
              - '!RecipeHub.Api/**'

  build-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    outputs:
      publish-path: ${{ steps.publish.outputs.publish_path || env.PUBLISH_PATH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate production appsettings from secrets
        working-directory: ./RecipeHub.Api
        shell: pwsh
        env:
          MYSQL_CONNECTION_STRING: ${{ secrets.MYSQL_CONNECTION_STRING }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          $required = @(
            @{ Name = 'MYSQL_CONNECTION_STRING'; Value = $env:MYSQL_CONNECTION_STRING }
          )

          $missing = $required | Where-Object { -not $_.Value }
          if ($missing) {
            throw "Missing required secrets: $($missing.Name -join ', ')"
          }

          $databaseName = [regex]::Match($env:MYSQL_CONNECTION_STRING, '(?i)(?:^|;)Database\s*=\s*([^;]+)').Groups[1].Value.Trim()
          $serverName = [regex]::Match($env:MYSQL_CONNECTION_STRING, '(?i)(?:^|;)Server\s*=\s*([^;]+)').Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($databaseName) -or [string]::IsNullOrWhiteSpace($serverName)) {
            throw "MYSQL_CONNECTION_STRING must include Server and Database values."
          }

          Write-Host "Production database target: Server=$serverName; Database=$databaseName"

          $aiProvider = if ([string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY)) { "Wikipedia" } else { "OpenAI" }

          $config = @{
            ConnectionStrings = @{
              MySql = $env:MYSQL_CONNECTION_STRING
            }
            Logging = @{
              LogLevel = @{
                Default = 'Information'
                Microsoft = 'Warning'
                'Microsoft.Hosting.Lifetime' = 'Information'
              }
            }
            JWTSettings = @{
              securityKey = "RecipeHubSecretKey 85738a5f-871a-4cd1-a03c-bfdfa352d3d2"
              validIssuer = "RecipeHub"
              validAudience = "https://recipes.api.sezginsahin.dk/"
              expiryInMinutes = 60
            }
            AIImageGeneration = @{
              Enabled = $true
              Provider = $aiProvider
              OpenAIApiKey = $env:OPENAI_API_KEY
              OpenAIEndpoint = "https://api.openai.com/v1/images/edits"
              OpenAIGenerationEndpoint = "https://api.openai.com/v1/images/generations"
              OpenAIUseEdits = $false
              OpenAIModel = "gpt-image-1"
              OpenAIImageSize = "1024x1024"
              OpenAIStylePrompt = "hand-drawn cross-hatching ink sketch, vintage packaging drawing, monochrome pen art, minimal color, clean white background"
              OpenAIFallbackModels = "dall-e-2"
              StableDiffusionEndpoint = "http://127.0.0.1:7860"
              StyleReferenceImagePath = "..\\RecipeHub\\src\\assets\\images\\milk.jpg"
            }
            AllowedHosts = '*'
          }

          $json = $config | ConvertTo-Json -Depth 5
          Set-Content -Path 'appsettings.Production.json' -Value $json -Encoding UTF8

      - name: Restore and build API
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Publish API
        id: publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            --configuration Release `
            --runtime ${{ env.RUNTIME_IDENTIFIER }} `
            --self-contained true `
            -p:CopyLocalLockFileAssemblies=true `
            --output ${{ env.PUBLISH_PATH }}
          echo "publish_path=${{ env.PUBLISH_PATH }}" >> $env:GITHUB_OUTPUT

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ${{ env.PUBLISH_PATH }}/

  build-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.ANGULAR_WORKING_DIR }}/package-lock.json

      - name: Install Angular dependencies
        working-directory: ${{ env.ANGULAR_WORKING_DIR }}
        run: npm ci

      - name: Inject Google Maps API key
        working-directory: ${{ env.ANGULAR_WORKING_DIR }}
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets['GOOGLE_MAPS_API_KEY'] }}
        shell: pwsh
        run: |
          (Get-Content src/environments/environment.prod.ts) -replace '\$\{GOOGLE_MAPS_API_KEY\}', $env:GOOGLE_MAPS_API_KEY | Set-Content src/environments/environment.prod.ts

      - name: Build Angular app
        working-directory: ${{ env.ANGULAR_WORKING_DIR }}
        run: npm run build-prod

      - name: Ensure Angular web.config is present
        working-directory: ${{ env.ANGULAR_WORKING_DIR }}
        shell: pwsh
        run: |
          $dist = Join-Path "dist/RecipeHub/browser" "web.config"
          if (-not (Test-Path $dist)) {
            Copy-Item "src/web.config" $dist -Force
          }

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ${{ env.ANGULAR_DIST_PATH }}/

  deploy-api:
    runs-on: windows-latest
    needs: [detect-changes, build-api]
    if: needs.detect-changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ${{ env.PUBLISH_PATH }}/

      - name: Verify API artifact for Simply requirements
        shell: pwsh
        run: |
          $publishDir = "${{ env.PUBLISH_PATH }}"
          $exePath = Join-Path $publishDir "RecipeHub.Api.exe"
          $webConfigPath = Join-Path $publishDir "web.config"
          $identityEfPath = Join-Path $publishDir "Microsoft.AspNetCore.Identity.EntityFrameworkCore.dll"

          if (-not (Test-Path $exePath)) {
            throw "Missing RecipeHub.Api.exe in publish output."
          }

          if (-not (Test-Path $webConfigPath)) {
            throw "Missing web.config in publish output."
          }

          if (-not (Test-Path $identityEfPath)) {
            throw "Missing Microsoft.AspNetCore.Identity.EntityFrameworkCore.dll in publish output."
          }

          $webConfig = Get-Content $webConfigPath -Raw

          if ($webConfig -notmatch 'processPath="\.\\RecipeHub\.Api\.exe"') {
            throw "web.config processPath is not set to .\\RecipeHub.Api.exe"
          }

          if ($webConfig -notmatch 'hostingModel="outofprocess"|hostingModel="OutOfProcess"') {
            throw "web.config hostingModel is not OutOfProcess"
          }

          Write-Host "✅ Artifact check passed (SCD + win-x86 + OutOfProcess compatible layout)."

      - name: Prepare web.config and logs for startup diagnostics
        shell: pwsh
        run: |
          $webConfig = Join-Path "${{ env.PUBLISH_PATH }}" "web.config"
          if (Test-Path $webConfig) {
            (Get-Content $webConfig -Raw) -replace 'stdoutLogEnabled="false"', 'stdoutLogEnabled="true"' | Set-Content $webConfig -Encoding UTF8
          }

          $logsDir = Join-Path "${{ env.PUBLISH_PATH }}" "logs"
          if (-not (Test-Path $logsDir)) {
            New-Item -ItemType Directory -Path $logsDir | Out-Null
          }

          $placeholder = Join-Path $logsDir ".keep"
          if (-not (Test-Path $placeholder)) {
            Set-Content -Path $placeholder -Value "keep" -Encoding UTF8
          }

      - name: Put API into maintenance mode
        shell: pwsh
        run: |
          $maintenanceFile = Join-Path $env:RUNNER_TEMP "app_offline.htm"
          Set-Content -Path $maintenanceFile -Value @"
          <!doctype html>
          <html><head><title>RecipeHub maintenance</title></head><body><p>RecipeHub is restarting. Please try again shortly.</p></body></html>
          "@ -Encoding UTF8

      - name: Upload API maintenance file without syncing directory
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ftpUri = "ftp://$($env:FTP_SERVER)/recipes.api/app_offline.htm"
          $credential = "$($env:FTP_USERNAME):$($env:FTP_PASSWORD)"
          & curl.exe --fail --silent --show-error --user $credential --upload-file (Join-Path $env:RUNNER_TEMP "app_offline.htm") $ftpUri
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload app_offline.htm to Simply FTP. curl exited with code $LASTEXITCODE"
          }

      - name: Wait for API process to release files
        shell: pwsh
        run: Start-Sleep -Seconds 15

      - name: Deploy API using FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ env.PUBLISH_PATH }}/
          server-dir: /recipes.api/
          dangerous-clean-slate: false

      - name: Remove API maintenance file
        if: always()
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          $ftpUri = "ftp://$($env:FTP_SERVER)/recipes.api/app_offline.htm"
          $lastError = $null

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              $request = [System.Net.FtpWebRequest]::Create($ftpUri)
              $request.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
              $request.Credentials = [System.Net.NetworkCredential]::new($env:FTP_USERNAME, $env:FTP_PASSWORD)
              $request.UsePassive = $true
              $request.UseBinary = $true
              $response = $request.GetResponse()
              $response.Dispose()
              Write-Host "✅ API maintenance file removed."
              exit 0
            } catch {
              if ($_.Exception.Message -match '550|not found|does not exist|No such file') {
                Write-Warning "The maintenance file is already absent from Simply FTP."
                exit 0
              }
              $lastError = $_
              Write-Host "Maintenance file removal attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 5) {
                Start-Sleep -Seconds 5
              }
            }
          }

          throw "Could not remove app_offline.htm from Simply FTP: $lastError"

      - name: Wait for app to restart
        shell: pwsh
        run: Start-Sleep -Seconds 15

      # - name: Health check API
      #   id: health_check
      #   continue-on-error: true
      #   shell: pwsh
      #   run: |
      #     if ([string]::IsNullOrWhiteSpace($env:API_HEALTH_URL)) {
      #       Write-Error "API_HEALTH_URL is not set"
      #     }
      #     Write-Host "Checking API health..."
